  <text x="375" y="868" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="400" fill="#5f3928" id="text29"><tspan x="375" dy="0" id="tspan29">Group related candidates and choose representatives</tspan></text>
