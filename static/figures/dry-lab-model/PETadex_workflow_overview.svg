<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="192mm" viewBox="0 0 200 192" role="img" aria-labelledby="title description">
  <title id="title">PETadex protein annotation workflow</title>
  <desc id="description">Protein sequences were annotated with InterProScan and HMMER. Existing hit tables were integrated in parallel to catalogue all hits, identify InterProScan annotations without HMMER overlap, and summarize coverage and unannotated regions. Results were visualized and audited. No additional disorder filtering was applied.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#805340" />
    </marker>
  </defs>
  <rect x="1" y="1" width="198" height="190" rx="2" fill="#e5d9cd" stroke="#c8b388" stroke-width="2" />
  <text x="100" y="11" font-family="DejaVu Sans, sans-serif" font-size="5.3" font-weight="700" text-anchor="middle" fill="#5f3928">PETadex domain annotation</text>
  <text x="100" y="17" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" text-anchor="middle" fill="#5f3928">From protein sequences to an accessory catalogue</text>
  <rect x="48" y="23" width="104" height="21" rx="2.5" fill="#e2e1dc" stroke="#679a79" stroke-width="0.75" />
  <rect x="48.4" y="23.4" width="103.2" height="1.8" rx="0.8" fill="#679a79" />
  <text x="100.0" y="30" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">Protein sequences</text>
  <text x="100.0" y="35.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Input protein FASTA</text>
  <path d="M 100 44 V 48 H 53 V 53" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 100 48 H 147 V 53" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="9" y="54" width="88" height="25" rx="2.5" fill="#e2e1dc" stroke="#5e689e" stroke-width="0.75" />
  <rect x="9.4" y="54.4" width="87.2" height="1.8" rx="0.8" fill="#5e689e" />
  <text x="53.0" y="61" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">InterProScan</text>
  <text x="53.0" y="66.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Reported annotation hits</text>
  <text x="53.0" y="70.7" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Domains, families and other features</text>
  <rect x="103" y="54" width="88" height="25" rx="2.5" fill="#e2e1dc" stroke="#7b5f9d" stroke-width="0.75" />
  <rect x="103.4" y="54.4" width="87.2" height="1.8" rx="0.8" fill="#7b5f9d" />
  <text x="147.0" y="61" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">HMMER · hmmsearch</text>
  <text x="147.0" y="66.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Reported domain hits</text>
  <text x="147.0" y="70.7" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">PAZy profile library</text>
  <path d="M 53 79 V 84 H 100 V 90" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 147 79 V 84 H 100 V 90" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="105" y="88" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" text-anchor="start" fill="#5f3928">Catalogue notebook</text>
  <rect x="22" y="92" width="156" height="25" rx="2.5" fill="#e2e1dc" stroke="#72a09c" stroke-width="0.75" />
  <rect x="22.4" y="92.4" width="155.2" height="1.8" rx="0.8" fill="#72a09c" />
  <text x="100.0" y="99" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">Integrate annotations · parallel by protein</text>
  <text x="100.0" y="104.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Validate IDs and coordinates; compare hit intervals</text>
  <text x="100.0" y="108.7" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Merge intervals for residue coverage; identify unannotated gaps</text>
  <path d="M 100 117 V 122 H 37 V 127" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 100 117 V 127" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 100 122 H 163 V 127" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="9" y="128" width="56" height="27" rx="2.5" fill="#e2e1dc" stroke="#5e689e" stroke-width="0.75" />
  <rect x="9.4" y="128.4" width="55.2" height="1.8" rx="0.8" fill="#5e689e" />
  <text x="37.0" y="135" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">All reported hits</text>
  <text x="37.0" y="140.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">InterProScan + HMMER</text>
  <text x="37.0" y="144.70000000000002" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Keep overlapping hits</text>
  <rect x="72" y="128" width="56" height="27" rx="2.5" fill="#e2e1dc" stroke="#b6693d" stroke-width="0.75" />
  <rect x="72.4" y="128.4" width="55.2" height="1.8" rx="0.8" fill="#b6693d" />
  <text x="100.0" y="135" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">Accessory candidates</text>
  <text x="100.0" y="140.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">InterProScan annotations</text>
  <text x="100.0" y="144.70000000000002" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">with zero HMMER overlap</text>
  <rect x="135" y="128" width="56" height="27" rx="2.5" fill="#e2e1dc" stroke="#679a79" stroke-width="0.75" />
  <rect x="135.4" y="128.4" width="55.2" height="1.8" rx="0.8" fill="#679a79" />
  <text x="163.0" y="135" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">Coverage &amp; sequences</text>
  <text x="163.0" y="140.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Per-protein summaries</text>
  <text x="163.0" y="144.70000000000002" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Hit sequences and</text>
  <text x="163.0" y="149.10000000000002" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">unannotated regions</text>
  <path d="M 37 155 V 159 H 100 V 163" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 100 155 V 163" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 163 155 V 159 H 100 V 163" fill="none" stroke="#805340" stroke-width="0.65" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="9" y="164" width="182" height="19" rx="2.5" fill="#e2e1dc" stroke="#9d5e91" stroke-width="0.75" />
  <rect x="9.4" y="164.4" width="181.2" height="1.8" rx="0.8" fill="#9d5e91" />
  <text x="100.0" y="171" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" text-anchor="middle" fill="#5f3928">Visualize &amp; audit</text>
  <text x="100.0" y="176.3" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" text-anchor="middle" fill="#5f3928">Signature frequency · co-occurrence · residue coverage · protein tracks</text>
  <text x="100" y="187.7" font-family="DejaVu Sans, sans-serif" font-size="2.65" font-weight="400" text-anchor="middle" fill="#5f3928">No added disorder filtering. MobiDB-lite is retained in tables; excluded from accessory frequency plots.</text>
</svg>