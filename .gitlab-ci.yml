image: node:20.19.0

variables:
  GATSBY_TELEMETRY_DISABLED: "1"
  GATSBY_PATH_PREFIX: "/toronto"
  XDG_CONFIG_HOME: "$CI_PROJECT_DIR/.config"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "slowest"

pages:
  stage: build
  # iGEM's shared runner enforces this limit.
  timeout: 10 minutes
  # Restoring the old download archive can exhaust the runner before scripts start.
  cache: []
  before_script:
    - npm ci --cache .npm --no-audit --no-fund
    # Installed dependencies stay in node_modules; discard only download caches.
    - rm -rf -- .npm
  script:
    - npm run build:igem
    - node scripts/trim-pages-artifact.mjs
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
