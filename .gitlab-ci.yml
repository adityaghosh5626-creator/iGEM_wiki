image: node:20.19.0-alpine

variables:
  GATSBY_TELEMETRY_DISABLED: "1"
  GATSBY_PATH_PREFIX: "/toronto"
  XDG_CONFIG_HOME: "$CI_PROJECT_DIR/.config"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "slowest"

pages:
  stage: build
  # Compilation runs on GitHub; GitLab's ten-minute job only publishes.
  timeout: 10 minutes
  cache: []
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/igem-pages-bundle.mjs unpack
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
