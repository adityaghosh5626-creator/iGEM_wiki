image: node:20.19.0

variables:
  GATSBY_TELEMETRY_DISABLED: "1"
  GATSBY_PATH_PREFIX: "/toronto"
  XDG_CONFIG_HOME: "$CI_PROJECT_DIR/.config"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "slowest"

pages:
  stage: build
  # Allow cold installs and production compilation to finish on shared runners.
  # A runner-level maximum timeout still takes precedence over this value.
  timeout: 30 minutes
  cache:
    # Reuse existing downloads without writing a new cache archive on the
    # shared runner, which can run out of disk after the build.
    policy: pull
    key:
      prefix: npm-node-20
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - npm run build:igem
    - node scripts/trim-pages-artifact.mjs
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
